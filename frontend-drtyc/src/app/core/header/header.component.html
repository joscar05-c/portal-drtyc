<nav class="bg-blue-800 border-blue-700 sticky top-0 z-50">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a routerLink="/" class="flex items-center space-x-3" (click)="cerrarMenu()">
      <img src="/img/LOGO DRTC-2026.png" alt="Logo DRTC" class="h-10 w-auto">
      <div class="hidden sm:block">
        <p class="text-sm font-semibold leading-tight text-white">DRTC</p>
        <p class="text-xs text-blue-200 leading-tight">Dirección Regional de Transportes y Comunicaciones</p>
      </div>
    </a>

    <div class="hidden md:block">
      <ul class="flex flex-col font-medium mt-4 rounded-lg bg-blue-800 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0">
        <li>
          <a routerLink="/"
             routerLinkActive="bg-blue-700"
             [routerLinkActiveOptions]="{ exact: true }"
             class="block py-2 px-3 text-white rounded-sm md:bg-transparent md:hover:text-blue-300 md:p-0">
            Inicio
          </a>
        </li>
        <li>
          <a routerLink="/transparencia"
             routerLinkActive="bg-blue-700"
             class="block py-2 px-3 text-white rounded-sm md:bg-transparent md:hover:text-blue-300 md:p-0">
            Transparencia
          </a>
        </li>
        <li>
          <a routerLink="/resoluciones"
             routerLinkActive="bg-blue-700"
             class="block py-2 px-3 text-white rounded-sm md:bg-transparent md:hover:text-blue-300 md:p-0">
            Resoluciones
          </a>
        </li>
        <li>
          <a routerLink="/convocatorias"
             routerLinkActive="bg-blue-700"
             class="block py-2 px-3 text-white rounded-sm md:bg-transparent md:hover:text-blue-300 md:p-0">
            Convocatorias
          </a>
        </li>
      </ul>
    </div>

    <button (click)="toggleMenu()"
            type="button"
            class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-white rounded-lg md:hidden hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
            [attr.aria-expanded]="menuAbierto()"
            aria-label="Menú de navegación">
      <span class="sr-only">Open main menu</span>
      <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
      </svg>
    </button>
  </div>

  @if (menuAbierto()) {
    <div class="md:hidden" id="navbar-default">
      <ul class="flex flex-col font-medium p-4 mt-0 border-t border-blue-700 bg-blue-800">
        <li>
          <a routerLink="/"
             routerLinkActive="bg-blue-700"
             [routerLinkActiveOptions]="{ exact: true }"
             (click)="cerrarMenu()"
             class="block py-2 px-3 text-white rounded-sm hover:bg-blue-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-300 md:p-0">
            Inicio
          </a>
        </li>
        <li>
          <a routerLink="/transparencia"
             routerLinkActive="bg-blue-700"
             (click)="cerrarMenu()"
             class="block py-2 px-3 text-white rounded-sm hover:bg-blue-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-300 md:p-0">
            Transparencia
          </a>
        </li>
        <li>
          <a routerLink="/resoluciones"
             routerLinkActive="bg-blue-700"
             (click)="cerrarMenu()"
             class="block py-2 px-3 text-white rounded-sm hover:bg-blue-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-300 md:p-0">
            Resoluciones
          </a>
        </li>
        <li>
          <a routerLink="/convocatorias"
             routerLinkActive="bg-blue-700"
             (click)="cerrarMenu()"
             class="block py-2 px-3 text-white rounded-sm hover:bg-blue-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-300 md:p-0">
            Convocatorias
          </a>
        </li>
      </ul>
    </div>
  }
</nav>
